<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4d061"/><stop offset="100%" stop-color="#b8862b"/>
    </linearGradient>
    <radialGradient id="greenDisc" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#74c64e"/><stop offset="60%" stop-color="#3f9a3c"/><stop offset="100%" stop-color="#2a7a2c"/>
    </radialGradient>
    <linearGradient id="canopyLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/><stop offset="100%" stop-color="#ffc933"/>
    </linearGradient>
    <linearGradient id="canopyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a4c2f4"/><stop offset="100%" stop-color="#345d8e"/>
    </linearGradient>
    <linearGradient id="droplet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfe9ff"/><stop offset="100%" stop-color="#1e66bf"/>
    </linearGradient>

    <path id="topArc" d="M 82 114 A 146 146 0 0 1 318 114" fill="none"/>
    <path id="twW" d="M 234.7 78.9 A 126 126 0 0 1 321.1 165.3" fill="none"/>
    <path id="twN" d="M 78.9 165.3 A 126 126 0 0 1 165.3 78.9"  fill="none"/>
    <path id="twE" d="M 234.7 321.1 A 126 126 0 0 0 321.1 234.7" fill="none"/>
    <path id="twC" d="M 78.9 234.7 A 126 126 0 0 0 165.3 321.1"  fill="none"/>
  </defs>

  <!-- ===== Gold double ring ===== -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#goldRing)" stroke-width="3"/>
  <circle cx="200" cy="200" r="170" fill="#ffffff" stroke="url(#goldRing)" stroke-width="9"/>

  <!-- ===== Model name ===== -->
  <text font-size="18" font-weight="bold" fill="#7a5a10" letter-spacing="5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">COMPASS</textPath>
  </text>

  <!-- ===== Water–Energy–Carbon–Nitrogen cycle ===== -->
  <g fill="none" stroke-width="11" stroke-linecap="round">
    <path d="M 234.7 78.9  A 126 126 0 0 1 321.1 165.3" stroke="#3296d6"/>
    <path d="M 321.1 234.7 A 126 126 0 0 1 234.7 321.1" stroke="#e8862e"/>
    <path d="M 165.3 321.1 A 126 126 0 0 1 78.9 234.7"  stroke="#34ad5e"/>
    <path d="M 78.9 165.3  A 126 126 0 0 1 165.3 78.9"  stroke="#9457bd"/>
  </g>
  <g font-size="9.5" font-weight="bold" fill="#ffffff" letter-spacing="0.5" dominant-baseline="middle">
    <text><textPath href="#twW" startOffset="50%" text-anchor="middle">WATER</textPath></text>
    <text><textPath href="#twE" startOffset="50%" text-anchor="middle">ENERGY</textPath></text>
    <text><textPath href="#twC" startOffset="50%" text-anchor="middle">CARBON</textPath></text>
    <text><textPath href="#twN" startOffset="50%" text-anchor="middle">NITROGEN</textPath></text>
  </g>

  <!-- ===== Green disc ===== -->
  <circle cx="200" cy="200" r="112" fill="url(#greenDisc)" stroke="#1f5f20" stroke-width="1.5"/>
  <ellipse cx="178" cy="150" rx="30" ry="14" fill="#ffffff" opacity="0.14"/>

  <!-- ===== Center : original 4-quadrant canopy tree ===== -->
  <!-- Sun -->
  <circle cx="200" cy="122" r="11" fill="#fff4b8" stroke="#cc8800" stroke-width="1.1"/>
  <g stroke="#ffd861" stroke-width="1.8" stroke-linecap="round">
    <line x1="200" y1="106" x2="200" y2="101"/>
    <line x1="213" y1="111" x2="217" y2="107"/>
    <line x1="216" y1="122" x2="222" y2="122"/>
    <line x1="213" y1="133" x2="217" y2="137"/>
    <line x1="187" y1="133" x2="183" y2="137"/>
    <line x1="184" y1="122" x2="178" y2="122"/>
    <line x1="187" y1="111" x2="183" y2="107"/>
  </g>

  <!-- 4-quadrant canopy (sun-leaf gold / shade-leaf blue) -->
  <ellipse cx="178" cy="170" rx="22" ry="17" fill="url(#canopyLight)" stroke="#b78a1f" stroke-width="1.1" transform="rotate(-25 178 170)"/>
  <path d="M 173 166 q -3 5 0 9 q 3 -2 3 -5 q -1 -3 -3 -4 z" fill="url(#droplet)" stroke="#0e3b6e" stroke-width="0.6"/>
  <ellipse cx="222" cy="170" rx="22" ry="17" fill="url(#canopyLight)" stroke="#b78a1f" stroke-width="1.1" transform="rotate(25 222 170)"/>
  <ellipse cx="178" cy="204" rx="22" ry="17" fill="url(#canopyDark)" stroke="#345d8e" stroke-width="1.1" transform="rotate(25 178 204)"/>
  <path d="M 173 200 q -3 5 0 9 q 3 -2 3 -5 q -1 -3 -3 -4 z" fill="url(#droplet)" stroke="#0e3b6e" stroke-width="0.6"/>
  <ellipse cx="222" cy="204" rx="22" ry="17" fill="url(#canopyDark)" stroke="#345d8e" stroke-width="1.1" transform="rotate(-25 222 204)"/>

  <!-- Trunk -->
  <rect x="195" y="220" width="10" height="22" fill="#7a4a1f" stroke="#3d2010" stroke-width="0.7"/>

  <!-- Soil line -->
  <line x1="128" y1="244" x2="272" y2="244" stroke="#3d2010" stroke-width="1.4"/>

  <!-- Deep root system -->
  <g stroke="#5a3018" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M 200 242 L 200 294"/>
    <path d="M 200 250 Q 180 258 165 268"/>
    <path d="M 200 250 Q 220 258 235 268"/>
    <path d="M 200 266 Q 175 274 158 284"/>
    <path d="M 200 266 Q 225 274 242 284"/>
    <path d="M 200 282 Q 185 288 172 296"/>
    <path d="M 200 282 Q 215 288 228 296"/>
    <path d="M 200 294 L 195 300"/>
    <path d="M 200 294 L 205 300"/>
  </g>
</svg>
