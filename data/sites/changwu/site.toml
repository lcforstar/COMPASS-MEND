depth_start_cm = 0  # [cm] shared by every straw-return event
depth_end_cm = 20   # [cm] shared by every straw-return event

[vegetation]
PFT_type = "Winter Wheat"             # selects the independent CoLM/CLM5 winter-wheat PlantCN path
# --- aerodynamic resistance ---
method       = "standard"       # verhoef | standard | optimal | table 
surface_type = "Grass"         # only used when method = "table"
crop_code    = 1              # leaf-width lookup for resistances_clm45: 1 = use leaf_width directly (static width); other codes = Tao-LAI inferred width [cfg.Veg.CropCode]
leaf_width   = 0.015   # [m]   characteristic leaf width -> leaf boundary-layer resistance rbc = 70/LAI*sqrt(w/u)
Cd           = 0.2    # [-]   leaf drag coefficient -> within-canopy wind attenuation n = Cd*LAI/(2*kappa^2)
rwc          = 0.0    # [s/m] extra within-canopy aerodynamic resistance (added on top of leaf b.l.); NOT relative water content
CR           = 0.35   # Verhoef method only: roughness extinction coefficient (sets displacement d and z0m)
CD1          = 20.6   # Verhoef method only: drag/shelter parameter
psicor       = 0.2    # Verhoef method only: atmospheric stability (Psi) correction
cssoil       = 0.01   # Verhoef method only: soil-surface drag coefficient
# --- leaf inclination distribution (Verhoef LIDF, |LIDFa|+|LIDFb|<=1; feeds RTMo/RTMt lidf) ---
LIDFa        = -1.0   # erectophile (legacy ScopeParameters value); spherical = -0.35
LIDFb        = 0.0    # legacy ScopeParameters value; spherical = -0.15
# --- foliage clumping for canopy radiation only; physical LAI remains unchanged ---
# Winter-wheat canopy clumping is selected from the PFT table.
clumping_index_source = "pft_table"  # pft_table | manual; manual is preferred when a site/grid value exists
clumping_index        = 0.76      # [-] Changwu effective value; 1=random, lower values=more clumped
# --- canopy layer profiles ---
canopy_layer_profiles = true   # unified canopy-layer structure/diagnostics switch; maps to legacy options.calc_vert_profiles
# --- canopy-air profile feedback (ebal_clm45_profile research branch) ---
canopy_air_profile_eb   = false
canopy_air_ta_feedback  = true
canopy_air_ea_feedback  = false
canopy_air_co2_feedback = false
# --- LAI and canopy height ---
vegetation_data_file = "canopy_measurements.csv" # measured canopy inputs; columns use DOY, LAI, hc, Vcmax, Cab, SAI order
LAI_mode      = "data"        # model | data | constant
LAI_engine    = "leafc_sla_phen"  # epic_phen_mix | leafc_sla_phen
hc_mode       = "data"     # (李正鹏 2017 DOI: 10.11975/j.issn.1002-6819.2017.04.027.)
SAI_mode      = "data"        # SAI≈0.23*LAI Zhu et al.（2024）
LAI_max       = 7.0           # [m2/m2] numerical cap (anti-blowup), NOT physiological
laimx         = 6.2           # [m2/m2] physiological peak LAI, matching measured wheat maximum
LAI_constant  = 3.0           # [m2/m2] LAI when LAI_mode=constant
canopy_height = 0.8           # [m] Changwu winter-wheat canopy height
SAI_constant  = 0.2           # [m2/m2] fallback stem area index
# --- vertical LAI profile shape ---
LAI_profile_mode  = "uniform"  # uniform | gaussian | beta | exponential
LAI_profile_peak  = 0.50       # relative height of peak (0=bottom, 1=top)
LAI_profile_sigma = 0.24       # Gaussian sigma (fraction of canopy height)
LAI_profile_skew  = 0.8        # beta-profile skewness
LAI_profile_k     = 1.5        # extinction/shape coefficient
# --- canopy interception ---
canopy_storage_per_LAI = 0.2   # [mm/LAI] max canopy water storage per LAI
interc_F0              = 0.15   # free throughfall fraction (Gash f_ER)
canopy_water_scheme    = "single"  # single | four_quadrant
# --- plant hydraulics ---
# hydraulic_scheme:
#   steady_spac      = v1 steady SPAC only (no organ water storage W)
#   storage_from_psi = diagnose W from psi via retention (VOD; current default)
#   storage_dynamic  = prognostic dW/dt path (same wrapper as storage_from_psi today)
# Legacy aliases still accepted: equilibrium -> steady_spac, dynamic -> storage_from_psi
hydraulic_scheme    = "steady_spac"
hydraulic_gpmax     = 1.5e-07  # [m/s/MPa] maximum whole-plant xylem conductance (SPAC) 【 Corso et al.（2020）1.0e-07-2.0e-07 】
hydraulic_p50       = -2.22     # [MPa] 50% conductivity loss   Corso et al.（2020） -2.22 SY Mattis leaf xylem; -2.30 lumped leaf–stem value
hydraulic_aa        = 3.2      # Manzoni vulnerability shape
hydraulic_psil_min  = -6       # [MPa] min leaf water potential
hydraulic_init_psir     = -0.10  # [MPa] initial root water potential
hydraulic_init_pstem    = -0.11  # [MPa] initial stem water potential
hydraulic_init_psil_sun = -0.12  # [MPa] initial sunlit-leaf water potential
hydraulic_init_psil_sha = -0.12  # [MPa] initial shaded-leaf water potential
# --- organ storage (active when storage_from_psi or storage_dynamic) ---
# current default: calSPAC psi + linear PV curve -> W (VWC for VOD).

# PV curve per organ:  water_stored = water_capacity * (retention_slope * psi + 1)
#   at psi=0 -> water_stored = capacity (full);  at psi = -1/slope -> water_stored = 0 (empty).
retention_slope_root = 3.3e-3   # [1/m] PV-curve slope, root  (larger = psi swings less per unit water change)
retention_slope_stem = 3.3e-3   # [1/m] PV-curve slope, stem
retention_slope_leaf = 3.3e-3   # [1/m] PV-curve slope, leaf
water_capacity_root  = 0.0006   # [m]   root water storage capacity (0.6 mm, fine-root tissue water)
water_capacity_stem  = 0.0008   # [m]   stem water storage capacity (0.8 mm sapwood, dominant capacitor)
water_capacity_leaf  = 0.0001   # [m]   leaf water storage capacity (0.1 mm leaf column at LAI=3)
path_root_to_stem    = 0.5       # [m]   root->stem water path length (sets gravity correction)
path_stem_to_leaf    = 0.5       # [m]   stem->leaf water path length (sets gravity correction)
stem_capacitance_lag = 0         # [s]   stem storage lag time constant (0 = instantaneous; >0 = AM/PM VOD swing on stem only)
# --- tree structure for gpmax fallback ---
# tree_DBH   = 21.3   # [cm]          diameter at breast height; only used to estimate gpmax when hydraulic_gpmax <= 0
# tree_CAH   = 10.2   # [m2]          crown area per tree; only used to estimate gpmax when hydraulic_gpmax <= 0
# tree_Ksmax = 5      # [kg/m/s/MPa]  max stem hydraulic conductance; only used to estimate gpmax when hydraulic_gpmax <= 0
# --- root system ---
root_dist_mode = 0              # 0=Jackson, 1=measured root.csv
root_measured_file = "root.csv" # measured root-length-density file when root_dist_mode=1
root_type      = 6             # Jackson beta-profile type; used only when root_dist_mode=0
root_max_depth = 200   # [cm] Jackson root_type=6 empirical profile, truncated and renormalized at 200 cm
root_rroot_mm  = 0.2    # [mm]   mean root radius
gsr_formula    = "radial_darcy_series"  # soil-root conductance: katul | clm5 | radial_darcy_series
# root-soil hydraulic resistance
root_hydraulic_krmax     = 0                    # [m/s] CLM5 root tissue krmax; 0 disables CLM5-krmax branch
root_side_mode           = "stemmus_scope_rrr"  # none | clm5_krmax | stemmus_scope_rrr
root_radial_impedance_Pr = 4e11                 # [s/m] STEMMUS-SCOPE radial impedance
root_contact_enabled     = false                # enable root-soil contact resistance
root_contact_psi_start   = -0.05                # [MPa] soil psi where contact resistance begins
root_contact_psi_end     = -1.5                 # [MPa] soil psi at full contact resistance
# root nitrogen uptake solver (DAISY single-root + Nacry membrane M-M)
root_solver_tol      = 1e-6   # [mg/L] bisection convergence tolerance
root_solver_max_iter = 50     # bisection max iterations
# --- phenology (GDD model, GA+fmincon calibrated, RMSE=0.348) ---
T_BASE     = 5.59    # [degC]
T_OPT      = 18.14   # [degC]
PHU        = 3921    # [degC*day]
GMHU       = 71.6    # [degC*day]
sowing_day = 258      # [DOY] winter-wheat sowing, approximately 15 September
FRGW1      = 0.024
LAIMX1     = 0.311
FRGW2      = 0.886
LAIMX2     = 0.867
DLAI       = 0.592
ALAI_MIN   = 0.293
beta_decay = 4.78
yr_cur     = 11      # current year in rotation (soil-N init)
yr_full    = 10      # full rotation length (years)
# --- plant C/N coupling (C-dominant FlexibleCN; species Vmax/Km/CN in PFT table) ---
cn_coupling_mode     = "flexible_cn"  # CLM5 FlexibleCN (C-dominant)
cn_flex_offset       = 10.0    # [gC/gN] C:N elasticity half-width (organ C:N clamp [CN_target, CN_target+offset])
# --- photosynthesis ---
photo_type        = "C3"       # C3 | C4
vcmax_source      = "manual"   # "pft_table" | "manual"  (Vcmax25 base source; LUNA overrides daily when luna=true)
vcmax_manual      = 100.7        # [umol/m2/s] (overridden by LUNA when luna=true)
luna              = true       # LUNA N->Vcmax feedback (needs switches.nitrogen)
cab_from_luna     = true       # drive leaf Cab from LUNA dynamic N
photo_Rd_C3       = 0.015      # Rd25/Vcmax25 ratio (C3)
photo_Rd_C4       = 0.025      # Rd25/Vcmax25 ratio (C4)
leaf_resp_method  = "vcmax_proportional"  # "vcmax_proportional" | "atkin2015"
# --- stomatal conductance (Medlyn + optional heat term) ---
# Medlyn gs [mol/m2/s] and slope
gs_g0        = 0.0001  # [mol/m2/s] minimum (residual) conductance
gs_g1        = 5.79    # [kPa^0.5]  Medlyn slope (CLM5)
gs_iter_init = 0.4     # initial gs guess
# Optional heat-induced additive gs (KEEP OFF until calibrated)
# docs/plant/stomata_heat_induced_gs_design.md
heat_gs_enable   = false   # master switch; false => g_heat≡0, pure Medlyn
# gs magnitudes [mol/m2/s]  (only used when heat_gs_enable=true)
heat_gs_max      = 0.08    # [mol/m2/s] g_heat full amplitude when all gates open
heat_gs_cap      = 0.6     # [mol/m2/s] total gs cap (gs0 + g_heat)
# linear gate ramps: 0→1 between (lo, hi); g_heat = max * φ_T * φ_w * φ_D * φ_A
heat_gs_T_on_C   = 32.0    # [degC]   φ_T starts
heat_gs_T_full_C = 38.0    # [degC]   φ_T full
heat_gs_wt_off   = 0.4     # [-]      φ_w starts (sfactor); below → g_heat=0
heat_gs_wt_on    = 0.8     # [-]      φ_w full
heat_gs_D_lo_kPa = 1.5     # [kPa]    φ_D starts closing
heat_gs_D_hi_kPa = 3.5     # [kPa]    φ_D = 0 at/above
heat_gs_A_lo     = 1.0     # [umol/m2/s] φ_A starts
heat_gs_A_hi     = 5.0     # [umol/m2/s] φ_A full

# =============================================================================
#  SCOPE radiative-transfer settings  (was input_data.xlsx 'options' sheet)
#  Fully merged here; no separate SCOPE Excel. File references (spectral/soil/
#  atmosphere) now resolve to data/model_library_nc/, not per-site.
# =============================================================================
[scope]
simulation             = 1     # 0=lookup table, 1=time series, 2=LUT-by-index
calc_ebal              = true  # solve canopy energy balance
calc_fluor             = true  # compute fluorescence (SIF)
calc_PSI               = false # separate PSI/PSII (false = combined fluspect)
calc_directional       = false # directional (BRDF) reflectance
calc_planck            = false # Planck (spectral thermal) emission
calc_xanthophyll_abs   = false # xanthophyll absorption
calc_rss_rbs           = true # soil resistance rss/rbs
fluorescence_model     = 0     # 0 = empirical, 1 = mechanistic
apply_T_corr           = true  # temperature correction of fluspect
soilspectrum           = 0     # 0 = file (model_library), 1 = BSM model
rt_thermal             = 0     # 0 = fixed leaf/soil emissivity, 1 = from optical tail
cca_function_of_cab    = true # tie carotenoid to chlorophyll
soil_heat_method       = 1     # production: dynamic force-restore from bare-skin temperature history; 2 retains the 0.30*Rn_bare alternative

# =============================================================================
#  SCOPE leaf & soil optics  (was input_data.xlsx 'inputdata' sheet)
#  !! values below are SCOPE TEMPLATE DEFAULTS carried over from the Yangling
#     example input_data.xlsx; NOT yet Changwu-calibrated. TODO: calibrate.
# =============================================================================
[model_library]                # shared SCOPE reference data (data/model_library_nc/, same for all sites)
format             = "netcdf"   # long-term authoritative library format (only netcdf supported)
leaf_optics_file   = "leaf_optics/Optipar2017_ProspectD.nc"  # PROSPECT-D leaf optical constants (nr, Kab, Kca, Kw, ...)
atmosphere_file    = "atmosphere/FLEX-S3_std.nc"              # MODTRAN atmospheric transmittance/radiance
soil_spectrum_file = "soil_spectrum/soilnew.nc"               # soil reflectance library (used when scope.soilspectrum=0)
leaf_angles_file   = ""                                       # OPTIONAL measured leaf inclination distribution (.nc, 13 bins). Empty => use [vegetation] LIDFa/LIDFb. e.g. "leaf_angles/soybean_wildtype_leafangles.nc"
# BRDF observer angles (scope.calc_directional=true). NetCDF var "data" = N x 2 [tto_deg, psi_deg].
directional_angles_file = "directional/brdf_angles2.nc"

[leaf_optical]                 # PROSPECT-PRO leaf biochemistry -> RTMo / fluspect
Cab              = 58     # [ug/cm2]  chlorophyll a+b
Cca              = 12      # [ug/cm2]  carotenoids (tied to Cab when scope.cca_function_of_cab=true)
Cdm              = 0.012   # [g/cm2]   leaf dry matter
Cw               = 0.009   # [cm]      leaf water equivalent thickness
Cs               = 0       # [-]       senescent (brown pigment) fraction
Cant             = 0       # [ug/cm2]  anthocyanins
N_mesophyll      = 1.4     # [-]       PROSPECT mesophyll structure parameter
leaf_rho_thermal = 0.01    # [-]       leaf reflectance, thermal band
leaf_tau_thermal = 0.01    # [-]       leaf transmittance, thermal band
fqe              = 0.01    # [-]       fluorescence quantum efficiency (SIF; scope.calc_fluor)
V2Z              = 0       # [0..1]    xanthophyll de-epoxidation state (Viola->Zea)
# fluorescence NPQ tuning (scope.calc_fluor)
fluor_beta         = 0.4   # [-] PSII fraction of absorbed light
fluor_kNPQs        = 0     # [-] sustained-NPQ rate constant
fluor_qLs          = 1     # [-] fraction of functional PSII reaction centres
fluor_stressfactor = 1     # [-] stress scaling on NPQ

[soil_optical]                 # soil reflectance + evaporation resistances -> RTMo / ebal
soil_spectrum_index = 1     # column in model_library.soil_spectrum_file (scope.soilspectrum=0)
rss                 = 500   # [s/m]  soil surface resistance to evaporation (scope.calc_rss_rbs)
rbs                 = 10    # [s/m]  soil aerodynamic boundary-layer resistance
rs_thermal          = 0.06  # [-]    soil reflectance, thermal band
# BSM spectral soil model (used only when scope.soilspectrum=1)
BSM_brightness = 0.5      # [-]    soil brightness
BSM_lat        = 25       # [deg]  BSM spectral-shape parameter (NOT the site latitude; SCOPE2 default)
BSM_lon        = 45       # [deg]  BSM spectral-shape parameter (NOT the site longitude; SCOPE2 default)

[geometry]                     # observation geometry; solar zenith tts auto-computed from lat/lon/time
observer_zenith  = 0      # [deg] tto: viewing zenith angle (0 = nadir)
relative_azimuth = 90     # [deg] psi: sun-viewing relative azimuth

[numerics]
# --- iteration limits ---
NIT                 = 100       # max Picard iterations per soil substep
max_iter_eb         = 200       # max canopy energy-balance iterations
# --- convergence tolerances ---
tol_theta           = 1e-4      # [-] maximum unsaturated endpoint increment
tol_head_saturated_cm = 0.1     # [cm] maximum saturated-node head increment
tol_water_mass_mm   = 1e-4      # [mm/step] long-run actual QMT/QMB/Srt mass residual
tol_surface_water_cm = 1e-5     # [cm/step] surface-reservoir mass and complementarity acceptance
tol_energy          = 0.1       # [degC-equivalent] max raw |dU|/(dU/dT) Picard-map defect
tol_energy_balance_J_cm2 = 1e-2 # [J/cm2/step] exact soil-column internal-energy residual
tol_air_relative    = 1e-3      # [-] maximum dry-air pressure increment relative to current pressure
tol_air_mass_g_cm2  = 1e-8      # [g/cm2/step] exact dry-air column mass residual
tol_eb              = 5         # [W/m2] canopy energy-balance closure tolerance
# --- frozen surface / soil-interface scalar closure ---
soil_interface_closure_enable = false      # legacy Dirichlet T* path only; atmospheric G closure is always active
soil_interface_closure_tol_W_m2 = 5     # [W/m2] production target; the 5 W/m2 physics-book criterion remains a hard upper bound, not an annual closure target
soil_interface_closure_max_iters = 6       # [-] maximum soil-only flux corrections after the analytic predictor
soil_interface_closure_substep_retry_enable = true       # refine soil tiles before relaxing interface closure
soil_interface_closure_substep_retry_factor = 0.5        # [-] geometric tile reduction across freeze/thaw jumps
soil_interface_closure_substep_retry_max_levels = 3      # [-] bounded temporal-refinement ladder
soil_interface_closure_bounded_acceptance_enable = true  # accept only a finite, fully converged best trial as last resort
soil_interface_closure_bounded_tol_W_m2 = 15.0           # [W/m2] hard cap; strict 5 W/m2 flag remains unchanged
soil_interface_closure_bounded_relative_tol = 0.20       # [-] fallback must also be <=20% of interface-flux magnitude
# --- numerical kernels ---
hydraulic_kernel    = "array"   # "array" (vectorized) | "scalar" (reference, for A/B verification)
matric_kernel       = "array"   # "array" (vectorized) | "scalar" (reference)
# --- discretization and stabilization ---
extrapolate         = false     # temporal extrapolation for initial guess
upwind              = true      # upwind scheme for convective terms
saturation_enforce  = true      # saturation detection and enforcement
artificial_disp     = false     # artificial dispersion (N-transport stabilization)
# --- runtime diagnostics and restart ---
checkpoint_interval = 168       # [steps] resume-checkpoint cadence (7 days for hourly forcing)
diagnostic_interval = 0         # [steps] accepted-state print
