# =============================================================================
#  COMPASS Site Configuration
#
#  Author:  Wenjie Liu
#  Contact: lcforstar@gmail.com
#
#  Function:
#    One self-contained configuration for a single COMPASS site run. It stores
#    scalar settings and process switches; tabular and array inputs remain in
#    the site folder. io.loadSite reads the following files when their owning
#    component is enabled by the simulation plan:
#      soil.csv            soil hydraulic, thermal, and nitrogen parameters
#      soil_initial_profile.csv  initial theta, T, gas pressure, bulk density, NH4, NO3, SOC
#      organic_initial_pools.csv native POC/MOC/MB/IOM fractions by depth
#      soil.csv            also stores ordered native C/DOM/microbial calibration priors
#      plant_initial_pools.csv   initial prognostic plant carbon and nitrogen pools
#      root.csv            measured root-length-density profile
#      forcing.csv         meteorological forcing time series
#      water_boundary.csv  prescribed water-head or water-flux time series
#      canopy_measurements.csv   measured LAI and canopy-structure time series
#
#    SCOPE also reads the shared NetCDF libraries selected in [model_library]:
#      data/model_library_nc/leaf_optics/       leaf optical constants
#      data/model_library_nc/atmosphere/        atmospheric transfer spectra
#      data/model_library_nc/soil_spectrum/     soil reflectance spectra
#
#    Format: TOML. on/off flags are true/false (loader maps to 1/0); units are in
#    # comments. No absolute paths; everything resolves relative to the site folder.
#    site-config-schema.json validates this file at load time and in VS Code;
#    the workspace .taplo.toml associates the schema with every site.toml.
# =============================================================================

[simulation]
# Spatial assembly: "point" uses one vertical column; "regional" assembles many columns.
spatial_mode = "point"
# Point driver: "field" uses meteorology, canopy, plants, and the natural surface;
# "laboratory" uses only soil, initial state, and prescribed water boundaries.
point_context = "field"

[site]
name        = "changwu"
description = "Changwu winter wheat field, Loess Plateau, China"
latitude    = 35.2497      # [deg N]
longitude   = 107.6877     # [deg E]
elevation   = 1220         # [m]

[time]
start             = "2000-06-15T00:00:00"
end               = "2001-06-15T00:00:00"
dt                = 3600        # [s] outer step = forcing interval
dt_max            = 3600        # [s] max adaptive timestep
dt_min            = 0.0864       # [s] min adaptive substep
forcing_timescale = "daily"     # forcing input cadence: "hourly" | "daily" (daily -> diurnal interp)
clock_basis       = "local_standard"  # forcing timestamp base: "local_standard" (station clock) | "utc" (global reanalysis)
utc_offset        = 8           # [h] local_standard clock = UTC + utc_offset (Changwu = Beijing UTC+8); ignored when clock_basis="utc"
forcing_start     = "2000-06-15T00:00:00"  # first timestamp in forcing.csv (clock); defaults to start

[output]
output_dir       = "../../output/changwu_winter_soc111"  # run output directory, relative to this site folder
legacy_csv       = false       # also write legacy CSV (PlotResults compat)
periodic_partial = false       # periodic partial-NC snapshots (off = faster)

[grid]
tot_depth    = 500        # [cm] total soil column depth
NL           = 200         # soil layer count; only used when uniform_grid=true; in non-uniform mode Dtrmn_Z auto-determines layers from tot_depth (NL ignored)
uniform_grid = false       # false = non-uniform (dense near surface), true = uniform
max_elements = 5000        # grid-element upper bound (memory guard)
NS           = 18          # number of soil parameter sample rows in soil.csv
nS           = 2           # sub-phases per layer (liquid + ice)
nD           = 2           # finite-difference time levels (current + previous)

[soil_input]
# soil.csv depth semantics. "sample_linear" (default) treats depth_cm as a
# measurement location and interpolates primitive parameters to element centers.
# "horizon_bounds" treats depth_cm as each constant horizon's lower boundary.
vertical_parameter_mode = "sample_linear"  # Interpolate measured soil parameters to layer centers.

[environment]
rin_unit_is_watt  = true       # incoming radiation: true=W/m2, false=MJ/m2/s
z_measure         = 2         # [m] reference height (must exceed canopy_height)
# --- wind height conversion (log-profile to z_measure) ---
wind_convert      = true       # convert raw U to z_measure via log-profile
wind_obs_height   = 2.0        # [m] measurement height of U (Changwu U2 = 2 m)
wind_z0_grass     = 0.03       # [m] station roughness (short grass WMO)
wind_d_grass      = 0.0        # [m] station displacement height
# --- soil thermal optical properties ---
rho_thermal_soil_dry = 0.086
rho_thermal_soil_wet = 0.020
# --- atmospheric CO2 + soil-T climatology ---
Ca  = 415    # [ppm]    atmospheric CO2 (2021)
Oa  = 209    # [per-mil] atmospheric O2 (SCOPE biochemical)
Tav = 9.3    # [degC] mean annual soil temperature
At  = 11.46  # [degC] annual amplitude of soil temperature

[switches]
# --- core equations: what the model solves ---
solve_soil_heat   = true   # soil heat conduction (off = isothermal)
solve_soil_air    = true   # soil dry-air pressure (off = ignore gas phase)
solve_nitrogen    = true   # soil nitrogen cycle (off = no soil N)
plant_cn_cycle    = true    # full-coupling annual diagnostic: PlantCN supplies live litter C/N
soil_carbon_model = true  # false keeps the legacy COMPASS empirical mineralization path
dissolved_organic_matter = true # independent DOC/DON owner, transport, and reactions
explicit_soil_microbes = true # MEMC explicit microbial growth/death; requires DOM
litter_input = true # live PlantCN litter plus CoLM vertical transport
microbial_dormancy = true # active/dormant microbial state exchange inside the soil-C model
microbial_transport = true # internal microbial movement; ignored when soil_carbon_model=false
soil_freezing     = true   # freeze-thaw physics (off = no ice)
root_water_uptake = true   # [lRwuef] master switch for all root-water uptake; false stages and commits zero RWU/Srt, independent of PlantCN
root_nitrogen_uptake = true # [lRsuef] all root N uptake; PlantCN on=demand DAISY+Nacry, off=passive max(Srt,0)*C
# --- soil water retention / freezing curves ---
water_retention_model         = "van_genuchten"  # "van_genuchten" | "clapp_hornberger"
soil_freezing_curve           = true             # strict soil-freezing characteristic curve
dallamico_phase_change        = false            # keep strict SFCC instantaneous equilibrium as the sole phase-change closure
temperature_affects_retention = true             # temperature correction of water retention
# --- heat: methods + couplings ---
wetting_heat_method          = "prunty"  # "prunty" | "milly"
thermal_conductivity_model   = "de_vries" # "de_vries" | "tian" | "peters_lidard" | "johansen" | "farouki"
effective_thermal_properties = true      # compute effective thermal conductivity + heat capacity (standard)
ebal_anderson_latent         = true      # ebal latent-heat closure uses the Anderson formulation (legacy default true) [lEbalAnderson]
bulk_density_source          = "initial" # which bulk density sets porosity/thermal: "initial" (soil_initial_profile.csv bd overrides) | "soil" (soil.csv per-horizon bd)
diurnal_temp_method          = "sunrise_anchored" # daily->hourly air-temp disaggregation: "legacy_sine" (fixed cos peak 15:00, MeteoData) | "sunrise_anchored" (sunrise/sunset sine + linear night cooling)
# --- soil water: transport ---
temperature_driven_liquid_flow  = true   # temperature-gradient liquid water flow
pressure_driven_vapor_diffusion = true   # air-pressure-driven vapor diffusion
pressure_driven_liquid_flow     = true   # air-pressure-driven liquid water flow
dual_porosity                   = false  # HYDRUS dual-porosity (preferential flow)
# --- biogeochemistry (C/N cycle settings) ---
track_total_nitrogen  = true   # total-N mass balance (liquid + adsorbed)
biological_n_fixation = false  # biological nitrogen fixation
nitrogen_input_phase  = "total"  # soil_initial_profile.csv NH4/NO3 phase: "total" (mg/kg dry soil, e.g. KCl-extractable -> converted to liquid via theta & adsorption) | "dissolved" (mg/L soil solution, used directly)

[dualporosity]                 # active only when switches.dual_porosity = true
theta_s_immobile = 0.05        # [-]   immobile saturation water content (0.03-0.08)
theta_r_immobile = 0.0         # [-]   immobile residual water content
omega_exch       = 0.01        # [1/h] first-order exchange coefficient

[snow]
# ClimaLand v1.0 bulk SnowModel: prognostic total SWE, retained liquid water,
# and internal energy. Total post-canopy precipitation is split with the
# Jennings et al. (2018) temperature-relative-humidity relation used by
# ClimaLand's neural-snow forcing tools; it is not a hard 0-degC threshold.
enabled = true
precipitation_phase_model = "climaland_jennings2018"
minimum_density_kg_m3 = 200.0
albedo = 0.8
emissivity = 0.97
liquid_holding_capacity = 0.08
wet_snow_hydraulic_conductivity_m_s = 0.001
regularization_swe_m = 0.1
cover_depth_scale_m = 0.106
cover_fraction_beta = 1.81
minimum_exchange_depth_m = 0.1

[organic]
# Native AOM/soil-carbon fixed structure. The soil_carbon_model switch is the
# sole master; organic N follows it. These rates are site-global because the
# current AOM equations do not support independent values by soil layer.
thermal_soc_source = "soil_static"
  k_litter_1d = 0.050676164383561664
  # CoLM MOD_Initialize tau_l1/tau_l2_l3/tau_cwd; days = 365/year.
  # Ordered metabolic/cellulose/lignin/CWD. k_litter_1d is legacy-only below.
  litter_component_rates_1d = [0.0506849315068493, 0.0134246575342466, 0.0134246575342466, 0.000821917808219178]
  litter_component_respiration = [0.55, 0.50, 0.50]
  # CoLM MOD_Const_PFT lf_* and fr_*; C and N apportioned once on entry.
  litter_leaf_fractions = [0.25, 0.50, 0.25]
  litter_root_fractions = [0.25, 0.50, 0.25]
  litter_cwd_fractions = [0.76, 0.24]
k_straw_1d = 0.0134180821925189
k_manure_1d = 0.06999999999840002
# Provisional Changwu calibration candidate: faster AOM solubilization is
# required to avoid routing nearly all incorporated manure C into immobile POC.
doc_leach_1d = 0.01
# Frozen CoLM environmental-response constants:
# MOD_Initialize.F90 (Q10/frozen Q10/smp limits/rf_decomp) and
# MOD_BGC_Soil_BiogeochemDecompCascadeBGC.F90 (depth e-folding).
respiration_fraction = 0.55
q10 = 1.5
frozen_q10 = 1.5
smpmax_mm = -200.0
smpmin_mm = -200000.0
depth_efolding_m = 10.0
# PlantCN material quality is retained by the native litter adapter.
fine_root_aom_fraction   = [0.20, 0.80, 0.00]
coarse_root_aom_fraction = [0.70, 0.30, 0.00]
leaf_aom_fraction        = [0.30, 0.70, 0.00]
wood_aom_fraction        = [0.80, 0.20, 0.00]
[dom]
sorption_model = "linear_equilibrium" # DOC and DON use their soil.csv Kd at every phase read.
# Numerical transport controls. Depth-resolved Kd and dispersivity are in
# soil.csv. MEND kinetic adsorption/desorption is disabled in equilibrium mode;
# microbial C/N reactions retain the paired source hourly map.
diffusion_cm2_s = 5.0e-5
transport_substep_s = 300.0
[organic_n]
# Pool-specific initialization/receiver C:N [g C g-1 N]. These values create
# the first N guess only; prognostic N pools are integrated independently and
# are never overwritten from C:N during the run.
CN_POC0 = 80.0
CN_MOC0 = 11.0
CN_QOC0 = 20.0
CN_MB0 = 8.0
CN_EP0 = 8.0
CN_EM0 = 8.0
CN_NEC0 = 10.0

[microbe]
reaction_method = "source_hourly" # paired source hourly C/N; DOM closure selected in [dom]
mend_ihr = 0                     # retain source independent respiration caps
mend_qmax_mg_g = 1.5              # aligned source final Pinitial(9)
mend_kba_g_mg = 6.0               # aligned source final Pinitial(10)
mend_kdes_mg_g_h = 0.006           # aligned source final Pinitial(11), 20 C
mend_fp_enzn = 1.0                # aligned source final Pinitial(34)
# MEND commit 92323c7 MM/Arrhenius source values. Most kinetic entries below
# follow the final Pinitial assignment in MEND_namelist.nml; the three
# microbial DIN uptake entries remain its initial Pinitial(28:30) prior, not
# the final optimized values. Rates use MEND's hourly clock. Water,
# inorganic-N, and winter-wheat PFT parameters retain their COMPASS values.
mend_kinetics = "MM"
reaction_substep_s = 300.0 # used only by rk4_equilibrium; source_hourly uses 3600 s
active_fraction_initial = 0.01
mend_lci_initial = 0.10
mend_vd_pom_h = 50.0
mend_ks_pom1_mg_g = 60.0
mend_ks_pom_ratio = 10.0
mend_enzyme_turnover_h = 0.00012289
mend_penzp = 0.00147568
mend_penzm_ratio = 4.50361918
mend_frac_pom_to_dom = 0.75
mend_frac_mortality_to_dom = 0.50
mend_vg_h = 0.00425194
mend_alpha = 0.05012233
mend_ks_dom_mg_g = 0.00010034
mend_cue_20 = 0.20109320
mend_cue_slope_per_c = 0.00520677
mend_mortality_multiplier = 0.01030726
mend_dormant_maintenance_ratio = 0.001
mend_swp_a2d_mpa = 0.46
mend_tau = 0.39
mend_wdorm = 3.38
mend_vnup_mb_h = 0.001          # upstream initial Pinitial(28), not optimized 0.1
mend_ks_nh4_mb_mg_g = 0.001     # COMPASS mg N/g; upstream initial numeric value
mend_ks_no3_mb_mg_g = 0.001     # COMPASS mg N/g; upstream initial numeric value
mend_cn_mb_min = 2.0
mend_cn_mb_max = 14.0
mend_cn_pom2 = 500.0
mend_cn_enzp = 3.0
mend_cn_enzm = 3.0
mend_biome = "MGC"
mend_som = "SOL"
# Source Fraction_type1=[0.07,0.37,0.56] for POM1/POM2/DOM.
mend_input_fraction = [0.07, 0.37, 0.56]
epsilon_n_mg_g = 1.0e-18   # [mg N g-1] numerical denominator floor only
[bioparticle]
# Numerical and initialization controls. Porous-medium attachment,
# detachment, straining and dispersivity profiles are in soil.csv.
mobile_fraction_initial = 0.05
diffusion_cm2_s = 1.0e-6
transport_substep_s = 300.0
[litter]
source = "plant_cn"
advection_m_s = 0.0
diffusivity_m2_s = 1.0e-10
root_distribution_beta = 0.967
aom_fraction = [0.5, 0.5, 0.0]

[biogeochemistry_coupling]
outer_step_s = 3600.0
dom_transport_substep_s = 300.0
microbe_reaction_substep_s = 300.0
checkpoint_requires_mode_match = true

[boundary]
# Select all soil boundary conditions here. The current combination is suited
# to a field orchard with natural surface forcing and a deep groundwater table:
#   water: atmospheric infiltration/evaporation + free drainage
#   heat: atmospheric surface coupling + free-drainage liquid energy export
#   dry air: atmospheric surface pressure + hydrostatic bottom pressure

# --- Water boundary ---------------------------------------------------------
# Top choices:
#   atmospheric   Natural rainfall, infiltration, and evaporation (field default)
#   constant_head / variable_head   Known ponding head or laboratory head
#   constant_flux / variable_flux   Known infiltration, evaporation, or irrigation
#   zero_flux     Sealed surface with no water exchange
# Bottom choices:
#   free_drainage Gravity drainage above a deep water table (field default)
#   constant_head / variable_head   Known groundwater head
#   constant_flux / variable_flux   Known recharge or drainage flux
#   zero_flux     Impermeable lower boundary
#
# For prescribed heads or fluxes, edit time_s, top_value, and bottom_value in
# water_boundary.csv. Head uses [cm]; flux uses [cm/s]. A constant mode requires
# one repeated value. Flux is positive into the soil: positive top flux is
# downward infiltration, negative top flux is evaporation, positive bottom flux
# is upward recharge, and negative bottom flux is downward drainage.
# variable_head uses linear interpolation. variable_flux is piecewise constant
# and integrated exactly. time_s starts at simulation time zero and must cover
# the complete simulation period.
water_boundary_file = "water_boundary.csv"
water_top_kind    = "atmospheric"
water_bottom_kind = "free_drainage"
# Maximum liquid depression storage [cm]. Zero means no retained pond: once
# the atmospheric flux would make h_surface positive, h_surface=0 and the
# excess becomes runoff. Use a measured/calibrated microtopographic depth to
# retain ponding; do not substitute saturated conductivity for this capacity.
surface_water_capacity_cm = 0.0

# --- Heat boundary ----------------------------------------------------------
# Top choices:
#   surface_energy_response   Experimental natural-surface boundary. Insert the
#                             temperature-linearized bare/snow external-energy
#                             response into the U-primary top row; SCOPE's
#                             empirical force-restore G remains diagnostic.
#   surface_temperature       Prescribe the frozen SCOPE Tss [degC]
#                             (production operator-split contract)
#   atmospheric              Match the frozen surface-energy tangent to the
#                             upper-20-cm dynamic soil heat response, then
#                             prescribe the unique matched G for this hour
#   specified_heat_flux       Use heat_top_value [J cm-2 s-1]
# Bottom choices:
#   seasonal_bottom_temperature  Use the calculated seasonal Tbh (field default)
#   fixed_temperature            Use heat_bottom_value [degC]
#   specified_heat_flux          Use heat_bottom_value [J cm-2 s-1]
#   free_drainage_internal_energy  Let bottom drainage carry liquid sensible
#                                  energy using the coupled bottom T and QMB;
#                                  heat_bottom_value is inactive
# Heat flux is positive into the soil. heat_top_value is inactive for the
# selected atmospheric mode. Tss remains a surface diagnostic and
# is not imposed on the prognostic soil-temperature node.
heat_top_kind     = "atmospheric"
heat_bottom_kind  = "free_drainage_internal_energy"
heat_top_value    = 25
heat_bottom_value = 15

# --- Dry-air boundary -------------------------------------------------------
# Top choices:
#   atmospheric_pressure  Follow atmospheric pressure forcing (field default)
#   fixed_pressure        Use dry_air_top_value [Pa]
#   specified_mass_flux   Use dry_air_top_value [g cm-2 s-1]
# Bottom choices:
#   hydrostatic_pressure  Apply the depth-dependent hydrostatic pressure (default)
#   zero_mass_flux        Seal the bottom against dry-air exchange
#   specified_mass_flux   Use dry_air_bottom_value [g cm-2 s-1]
# Dry-air mass flux is positive into the soil and is not a pressure-change rate.
dry_air_top_kind     = "atmospheric_pressure"
dry_air_bottom_kind  = "hydrostatic_pressure"
dry_air_top_value    = 101325
dry_air_bottom_value = 0

# --- Nitrogen boundary (legacy integer adapter) -----------------------------
# 1=fixed concentration, 2=specified solute flux, 3=natural/outflow boundary.
# Concentration uses [mol/m3]. The current setup has zero top input and solute
# transport with bottom drainage. Urea enters through fertilization and
# hydrolysis, not through a boundary-transport condition.
nh4_top          = 2
nh4_bottom       = 3
nh4_top_value    = 0
nh4_bottom_value = 0
no3_top          = 2
no3_bottom       = 3
no3_top_value    = 0
no3_bottom_value = 0

